Categories:
  - Connectivity
  - Navigation
License: MIT
AuthorName: PebbleNTN contributors
SourceCode: https://github.com/optio/PebbleNTN
IssueTracker: https://github.com/optio/PebbleNTN/issues
Changelog: https://github.com/optio/PebbleNTN/releases

AutoName: PebbleNTN

RepoType: git
Repo: https://github.com/optio/PebbleNTN.git
# Reproducible builds: F-Droid rebuilds from source and verifies against this published,
# release-signed APK, then distributes our signature. See fdroid/REPRODUCIBLE_BUILDS.md.
Binaries: https://github.com/optio/PebbleNTN/releases/download/v%v/pebble-ntn.apk

Builds:
  - versionName: 0.0.23
    versionCode: 23
    commit: v0.0.23
    subdir: android/app
    # The Pebble watchapp's package.json is app metadata with no npm dependencies and is not part of
    # the Android build (subdir android/app); the scanner still requires a lockfile for any
    # package.json, so it is ignored here.
    scanignore:
      - watchapp/package.json
    gradle:
      - yes

# 64-hex SHA-256 of the release signing certificate. The release workflow prints it
# ("F-Droid AllowedAPKSigningKeys for this signed APK"); read it from the v0.0.23 run, or run
# `apksigner verify --print-certs pebble-ntn.apk`. Fill it in before submitting with RB enabled.
AllowedAPKSigningKeys: REPLACE_WITH_RELEASE_CERT_SHA256
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 0.0.23
CurrentVersionCode: 23
